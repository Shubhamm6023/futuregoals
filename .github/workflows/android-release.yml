name: Android Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  issues: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bubblewrap downloads the app icons from the live site, so wait until
      # the latest GitHub Pages deploy (triggered by the main push) is live.
      - name: Wait for live site
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://shubhamm6023.github.io/futuregoals/icon-512.png || true)
            if [ "$code" = "200" ]; then echo "Site is live ✓"; exit 0; fi
            echo "waiting for Pages deploy... ($i/60)"
            sleep 10
          done
          echo "Site not live after 10 minutes"
          exit 1

      # Builds a signed APK + AAB using Bubblewrap's official container
      # (includes the Android SDK + JDK). Passwords come from the env vars
      # below; the keystore is committed at android/future-release.keystore.
      # NOTE: before publishing to Google Play, replace this keystore with a
      # private one stored as a GitHub secret and delete it from the repo.
      - name: Build signed APK + AAB with Bubblewrap
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: futuregoal2026
          BUBBLEWRAP_KEY_PASSWORD: futuregoal2026
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          report() { # $1 = label of the failed command
            echo "### $1 failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 150 bw.log >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 150 bw.log > bw-tail.txt || true
            gh issue create --title "Auto-debug: $1 failed" --body-file bw-tail.txt \
              || echo "(issue creation failed — check the run Summary tab)"
            exit 1
          }
          # The container has no TTY, so sdkmanager's "Accept? (y/N)" prompt gets
          # EOF and skips new SDK packages (build-tools 35/36, android-36), which
          # then fails Gradle. Pre-seed the standard license-hash files instead,
          # and pipe `yes` to answer any other leftover prompt.
          run_in_container() { # $@ = bubblewrap subcommand + args
            docker run --rm -i -v "$PWD/android:/app" -w /app \
              -e BUBBLEWRAP_KEYSTORE_PASSWORD -e BUBBLEWRAP_KEY_PASSWORD \
              --entrypoint sh ghcr.io/googlechromelabs/bubblewrap:latest -c '
                SDK_DIR="${ANDROID_HOME:-/root/.bubblewrap/android_sdk}"
                mkdir -p "$SDK_DIR/licenses"
                printf "%s\n" 8933bad161af4178b1185d1a37fbf41ea5269c55 \
                  d56f5187479451eabf01fb78af6dfcb131a6481e \
                  24333f8a63b6825ea9c5514f83c2829b004d1fee \
                  > "$SDK_DIR/licenses/android-sdk-license"
                printf "%s\n" 84831b9409646a918e30573bab4c7c9a4b584b9f \
                  > "$SDK_DIR/licenses/android-sdk-preview-license"
                yes | bubblewrap "$@"
              ' sh "$@"
          }
          run_in_container update --skipVersionUpgrade 2>&1 | tee bw.log \
            || report "bubblewrap update"
          run_in_container build --skipPwaValidation 2>&1 | tee bw.log \
            || report "bubblewrap build"

      - name: List build outputs
        run: ls -la android/ | grep -E "apk|aab" || true

      - name: Upload APK + AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: future-android
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Future ${{ github.ref_name }}
          files: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
          body: |
            **Future v${{ github.ref_name }}** — Android release.

            📱 **Install on your phone:** download `app-release-signed.apk`,
            open it, and allow "Install unknown apps" when prompted.

            🛒 **Google Play (optional):** upload `app-release-bundle.aab`
            to the Play Console.
          draft: false
          prerelease: false